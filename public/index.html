<body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
<header class="topbar">
 <a class="brand" href="#"><span class="brand-mark"><svg viewBox="0 0 44 44"><path d="M7 14c8-9 22-9 30 0M7 30c8 9 22 9 30 0M7 14l30 16M7 30l30-16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="22" cy="22" r="4" fill="#d9a93e"/></svg></span><span><b>وِثاق</b><small>نسيج الولاء</small></span></a>
 <nav class="role-switch" aria-label="نوع الواجهة"><button class="active" data-view="customer">العميل</button><button data-view="merchant">التاجر</button><button data-view="staff">الموظف</button><button data-view="platform" id="platformTab" hidden>الإدارة</button></nav>
 <div class="top-actions"><span id="connection" class="connection"><i></i> متصل</span><button id="authButton" class="btn btn-outline">تسجيل الدخول</button><button id="profileButton" class="avatar" hidden>و</button></div>
</header>
<main id="app" class="shell"><div class="loading"><span class="spinner"></span><p>ننسج تجربتك...</p></div></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="authDialog" class="dialog"><form id="authForm" method="dialog"><button class="dialog-close" type="button" data-close>×</button><div class="eyebrow">مرحباً بك في وِثاق</div><h2>كل مكافآتك، في مكان واحد.</h2><p class="muted">سجّل برقم هاتفك. سنرسل رمز تحقق لمرة واحدة.</p><label>رقم الهاتف<input id="phone" type="tel" autocomplete="tel" placeholder="+9677XXXXXXXX" required></label><div id="otpWrap" hidden><label>رمز التحقق<input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"></label></div><button class="btn btn-gold full" id="authSubmit">إرسال رمز التحقق</button><p id="authError" class="error"></p><small class="muted">بالمتابعة، أنت توافق على شروط الاستخدام وسياسة الخصوصية.</small></form></dialog>
<dialog id="scanDialog" class="dialog scan-dialog"><div class="scan-inner"><button class="dialog-close" type="button" data-scan-close>×</button><div class="eyebrow">ماسح وِثاق</div><h2>وجّه الكاميرا نحو رمز العميل</h2><video id="scanVideo" playsinline muted></video><p class="muted">يتم التحقق من الرمز على الخادم بعد قراءته.</p></div></dialog><script src="./config.js"></script><script type="module" src="./app.js"></script>
