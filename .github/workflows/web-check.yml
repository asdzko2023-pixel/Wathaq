name: WATHAQ Web Checks
on:
  push:
    branches: [build/wathaq-premium-foundation]
    paths:
      - 'web/**'
      - 'app/**'
      - 'public/**'
      - 'supabase/bootstrap/**'
      - 'supabase/tests/**'
      - '.github/workflows/web-check.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'app/**'
      - 'public/**'
      - 'supabase/bootstrap/**'
      - 'supabase/tests/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Build deployable WATHAQ Core bundle
        run: node app/build.mjs
      - name: Verify committed public bundle matches source
        run: git diff --exit-code -- public/
      - name: Check generated bundle and bootstrap
        run: node --check public/app.js && test -s public/index.html && test -s public/config.js && test -s supabase/bootstrap/wathaq-core.sql && test -s supabase/tests/core_contract_tests.sql && test -s supabase/tests/loyalty_transaction_integration.sql && grep -q 'ncfromrlnlotrwkgjenk.supabase.co' public/config.js && ! grep -q 'service_role' public/config.js
      - name: Upload WATHAQ Core build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wathaq-core-public
          path: public/
          if-no-files-found: error
