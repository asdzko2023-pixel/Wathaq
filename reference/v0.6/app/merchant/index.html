<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التاجر — وِثاق</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --border: #2d3a4f;
      --text: #e8eef7;
      --text-muted: #8b9bb4;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --sidebar-w: 260px;
      --bottom-h: 64px;
      --font: "Segoe UI", "Tahoma", "Arial", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--primary); text-decoration: none; }
    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* Layout */
    .app {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar (desktop) */
    .sidebar {
      display: none;
      width: var(--sidebar-w);
      background: var(--surface);
      border-left: 1px solid var(--border);
      flex-direction: column;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
    }
    .sidebar-brand {
      padding: 1.25rem 1.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sidebar-brand span { color: var(--primary); }
    .sidebar-nav {
      flex: 1;
      padding: 1rem 0.75rem;
      overflow-y: auto;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
      transition: background 0.15s, color 0.15s;
    }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active {
      background: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      font-weight: 600;
    }
    .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .sidebar-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .topbar h1 {
      font-size: 1.15rem;
      font-weight: 600;
    }
    .merchant-select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      max-width: 200px;
    }

    .content {
      flex: 1;
      padding: 1.25rem;
      padding-bottom: calc(var(--bottom-h) + 1.5rem);
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    /* Bottom nav (mobile) */
    .bottom-nav {
      display: flex;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bottom-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      z-index: 40;
      justify-content: space-around;
      align-items: center;
      padding: 0 0.25rem;
    }
    .bottom-nav .nav-item {
      flex-direction: column;
      gap: 0.15rem;
      padding: 0.4rem 0.5rem;
      font-size: 0.7rem;
      margin: 0;
      border-radius: 8px;
      min-width: 0;
      flex: 1;
      text-align: center;
    }
    .bottom-nav .nav-item svg { width: 22px; height: 22px; margin: 0 auto; }

    /* Drawer for more items on mobile */
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 50;
    }
    .drawer-overlay.open { display: block; }
    .drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      padding: 1rem;
      z-index: 51;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      max-height: 70vh;
      overflow-y: auto;
    }
    .drawer.open { transform: translateY(0); }
    .drawer-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 1rem;
    }

    /* Cards & UI */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem;
      text-align: center;
    }
    .kpi-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.2;
    }
    .kpi-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .kpi-def {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      opacity: 0.85;
      line-height: 1.35;
    }

    .banner {
      padding: 0.85rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .banner-warning {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
    }
    .banner-info {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #93c5fd;
    }
    .banner-success {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #86efac;
    }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-pending { background: rgba(245,158,11,0.2); color: #fbbf24; }
    .status-approved { background: rgba(34,197,94,0.2); color: #86efac; }
    .status-suspended { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .status-active { background: rgba(34,197,94,0.2); color: #86efac; }
    .status-inactive { background: rgba(139,155,180,0.2); color: #94a3b8; }
    .status-draft { background: rgba(139,155,180,0.2); color: #94a3b8; }

    /* Forms */
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .form-control {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      transition: border-color 0.15s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }
    textarea.form-control { min-height: 90px; resize: vertical; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.6rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-secondary {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover:not(:disabled) { background: var(--border); }
    .btn-danger {
      background: rgba(239,68,68,0.15);
      color: #fca5a5;
      border: 1px solid rgba(239,68,68,0.3);
    }
    .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.8rem; }
    .btn-block { width: 100%; }

    .form-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }

    /* Table */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 0.75rem 1rem;
      text-align: right;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: var(--surface-2);
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.8rem;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .ops-cards { display: none; }
    .op-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .op-card-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.35rem;
      font-size: 0.9rem;
    }
    .op-card-row:last-child { margin-bottom: 0; }
    .op-card-label { color: var(--text-muted); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
      align-items: center;
    }
    .filters .form-control { width: auto; min-width: 120px; }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .pagination-info { font-size: 0.85rem; color: var(--text-muted); }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
    }
    .empty-state p { margin-top: 0.5rem; }

    .list-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.15rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .list-item-main { flex: 1; min-width: 0; }
    .list-item-title { font-weight: 600; margin-bottom: 0.25rem; }
    .list-item-meta { font-size: 0.85rem; color: var(--text-muted); }
    .list-item-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

    .reward-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .reward-row:last-child { border-bottom: none; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 60;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 {
      font-size: 1.15rem;
      margin-bottom: 1rem;
    }
    .modal-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
      justify-content: flex-end;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }
    .error-msg {
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .success-msg {
      color: var(--success);
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .note {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.75rem;
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .sidebar { display: flex; }
      .bottom-nav { display: none; }
      .main { margin-right: var(--sidebar-w); }
      .content { padding: 1.75rem 2rem; padding-bottom: 2rem; }
      .ops-table { display: table; }
      .ops-cards { display: none; }
    }

    /* Mobile ops cards */
    @media (max-width: 1023px) {
      .ops-table-wrap { display: none; }
      .ops-cards { display: block; }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">وِثاق <span>تاجر</span></div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <h1 id="page-title">لوحة التاجر</h1>
        <div id="topbar-actions"></div>
      </header>
      <div class="content" id="content">
        <div class="loading">جاري التحميل…</div>
      </div>
    </div>

    <!-- Bottom nav (mobile) -->
    <nav class="bottom-nav" id="bottom-nav"></nav>

    <!-- Drawer -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="drawer" id="drawer">
      <div class="drawer-handle"></div>
      <div id="drawer-content"></div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="modal"></div>
    </div>
  </div>

  <script src="../config.js"></script>
  <script type="module" src="./boot.mjs"></script>
</body>
</html>
