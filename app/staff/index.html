/* WATHAQ components. Uses only tokens from ../design-tokens/tokens.css. RTL-safe (logical properties). */

.w-app :focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}
.w-ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.w-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--touch-min-target);padding-inline:var(--space-5);border:1px solid transparent;border-radius:var(--radius-md);font:inherit;font-weight:var(--font-weight-semibold);cursor:pointer;transition:transform var(--motion-press) var(--motion-ease-out),background-color var(--motion-small) var(--motion-ease-out),opacity var(--motion-small)}

.w-btn--primary{background:var(--color-accent);color:var(--color-on-accent)}
.w-btn--gold{background:var(--gradient-gold);color:var(--color-on-accent)}
.w-btn--secondary{background:var(--color-surface-muted);color:var(--color-text);border-color:var(--color-border)}
.w-btn--ghost{background:none;color:var(--color-accent-text)}
.w-btn--block{display:flex;width:100%}
.w-btn[disabled],.w-btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none}
.w-btn[aria-busy="true"]{pointer-events:none}
.w-btn[aria-busy="true"]::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:w-spin .8s linear infinite}
@keyframes w-spin{to{transform:rotate(360deg)}}
/* Fields */
.w-field{display:block;margin-block-end:var(--space-4)}
.w-field>span{display:block;font-size:var(--font-size-small);font-weight:var(--font-weight-medium);color:var(--color-text-muted);margin-block-end:var(--space-1)}
.w-input{width:100%;min-height:var(--touch-min-target);padding-inline:var(--space-4);background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-text-muted);border-radius:var(--radius-md);font:inherit;transition:border-color var(--motion-small),box-shadow var(--motion-small)}

body{margin:0;background:var(--color-bg)}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
#splash{position:fixed;inset:0;z-index:20;background:#0B0B0D;display:grid;place-content:center;justify-items:center;gap:16px;text-align:center;color:#A9A9B2;transition:opacity .3s ease}
#splash.out{opacity:0;pointer-events:none}
.px{padding:0 20px}.h{display:flex;align-items:center;justify-content:space-between;height:64px;gap:8px}.h1{font-size:var(--font-size-page);font-weight:700;line-height:1.3;margin:0}
.h2{font-size:var(--font-size-section);font-weight:600;margin:24px 0 12px;display:flex;justify-content:space-between;align-items:baseline}.h2 a{font-size:14px;font-weight:500;color:var(--color-accent-text)}
.m{color:var(--color-text-muted);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -20px;padding:0 20px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--color-text);color:var(--color-bg);border-color:var(--color-text);font-weight:600}
.ro{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--color-border)}.ro:first-child{border:0}.ro>div{flex:1;min-width:0}
.hero{background:#0B0B0D;color:#fff;border-radius:20px;padding:20px}.hero .m{color:#A9A9B2}.g{color:#F2D98D}
.note{display:flex;gap:8px;background:var(--color-info-bg);color:var(--color-info);border-radius:12px;padding:12px 16px;font-size:14px}
.off{display:flex;gap:8px;align-items:center;background:var(--color-warning-bg);color:var(--color-warning);padding:8px 16px;font-size:14px;font-weight:500}
.w-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);z-index:10}
.w-card .ro:last-child{padding-bottom:4px}.w-lcard{text-decoration:none}
a.w-btn{text-decoration:none}

#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:32px}
.staff-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--color-border);background:var(--color-surface)}
.staff-head>div{min-width:0;overflow-wrap:anywhere}
.staff-main{padding:14px;display:grid;gap:14px}
.staff-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.staff-tabs .chip{white-space:normal;min-height:48px}
.staff-card{padding:16px;min-width:0}
.staff-card .h2{margin:0 0 16px}
.staff-card .w-field{margin:14px 0}
.staff-card .w-input{width:100%;min-width:0;box-sizing:border-box}
.earn-code{margin-top:18px;padding:18px 12px;border:1px solid var(--color-border);border-radius:16px;text-align:center;background:var(--color-surface)}
.earn-code .code{font:700 clamp(30px,9vw,44px)/1.35 ui-monospace,monospace;letter-spacing:.16em;white-space:nowrap;color:var(--color-accent-text);margin:10px 0;direction:ltr}
.earn-code p{font-size:14px;line-height:1.7}
.countdown{font-weight:700;margin:8px 0 14px}

.result.success{background:var(--color-success-bg);color:var(--color-success)}
.session-list{list-style:none;padding:0;margin:0}
.session-list li{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:12px 0;border-top:1px solid var(--color-border);font-size:14px}
.session-list li:first-child{border-top:0}
.session-list time{grid-column:1/-1;color:var(--color-text-muted);font-size:12px}
.redeem-input{text-transform:uppercase;letter-spacing:.12em}
@media(max-width:380px){.staff-main{padding:10px}.staff-head{padding:12px}.staff-head .w-btn{padding-inline:10px;font-size:13px}.staff-card{padding:12px}}
