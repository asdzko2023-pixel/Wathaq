name: WATHAQ Core CI and controlled Pages release

on:
  push:
    branches: [main, build/wathaq-premium-foundation]
    paths:
      - 'web/**'
      - 'app/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'docs/ANDROID_BUILD.md'
      - 'public/**'
      - 'supabase/bootstrap/**'
      - 'supabase/tests/**'
      - '.github/workflows/ci-deploy.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'app/**'
      - 'public/**'
      - 'supabase/bootstrap/**'
      - 'supabase/tests/**'
      - '.github/workflows/ci-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to GitHub Pages only after all release gates are complete'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

permissions:
  contents: read

concurrency:
  group: wathaq-core-pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Capacitor Android configuration
        run: |
          npm install --ignore-scripts
          npx cap config
      - name: Check WATHAQ Core source
        run: node --check web/app.js
      - name: Build current WATHAQ Core web app
        run: node app/build.mjs
      - name: Verify generated bundle
        run: |
          node --check public/app.js
          git diff --exit-code -- public/
          test -s public/index.html
          test -s public/config.js
          test -s public/manifest.webmanifest
          test -s public/icon.svg
          test -s public/sw.js
          test -s supabase/bootstrap/wathaq-core.sql
          test -s supabase/tests/core_contract_tests.sql
          test -s supabase/tests/loyalty_transaction_integration.sql
          grep -q 'ncfromrlnlotrwkgjenk.supabase.co' public/config.js
          ! grep -RInE 'service_role|sb_secret_' public web/config.js
      - name: Upload WATHAQ Core Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
