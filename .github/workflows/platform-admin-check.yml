name: WATHAQ Platform Admin Checks
on:
  push:
    branches: [admin/platform-console-v1]
    paths:
      - 'platform-admin/**'
      - 'packages/design-tokens/**'
      - 'app/config.js'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/platform-admin-check.yml'
  pull_request:
    paths:
      - 'platform-admin/**'
      - 'packages/design-tokens/**'
      - 'app/config.js'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/platform-admin-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check platform admin JavaScript syntax
        run: node --check platform-admin/app.js
      - name: Type-check secure merchant invitation function
        run: deno check --no-lock --config supabase/functions/platform-create-merchant-account/deno.json supabase/functions/platform-create-merchant-account/index.ts
      - name: Validate standalone console assets
        run: |
          test -s platform-admin/index.html
          test -s platform-admin/styles.css
          test -s platform-admin/app.js
          test -s app/config.js
          test -s packages/design-tokens/tokens.css
          grep -q "rpc('admin_set_merchant_status'" platform-admin/app.js
          grep -q "functions.invoke('platform-create-merchant-account'" platform-admin/app.js
          grep -q "rpc('admin_list_subscription_plans'" platform-admin/app.js
          grep -q "rpc('admin_list_merchant_subscriptions'" platform-admin/app.js
          grep -q "rpc('admin_manage_merchant_subscription'" platform-admin/app.js
          grep -q "rpc('admin_list_subscription_history'" platform-admin/app.js
          grep -q 'data-view="merchant-create"' platform-admin/app.js
          grep -q "rpc('admin_list_user_profiles'" platform-admin/app.js
          grep -q "rpc('admin_list_merchant_staff'" platform-admin/app.js
          grep -q "rpc('admin_get_platform_stats'" platform-admin/app.js
          grep -q "rpc('admin_list_merchants'" platform-admin/app.js
          grep -q "rpc('admin_get_loyalty_dashboard'" platform-admin/app.js
          grep -q "rpc('admin_list_platform_audit'" platform-admin/app.js
          grep -q "rpc('admin_get_analytics_report'" platform-admin/app.js
          grep -q "rpc('admin_create_qr_batch'" platform-admin/app.js
          grep -q "rpc('admin_list_qr_batches'" platform-admin/app.js
          grep -q "rpc('admin_list_qr_eligible_programs'" platform-admin/app.js
          grep -q "rpc('admin_get_qr_batch_print_data'" platform-admin/app.js
          grep -q "rpc('admin_revoke_qr_batch'" platform-admin/app.js
          grep -q "data-view=\\\"qr-factory\\\"" platform-admin/app.js
          grep -q "data-view=\"analytics\"" platform-admin/app.js
          grep -q "rpc('admin_list_platform_roles'" platform-admin/app.js
          grep -q "rpc('admin_get_my_permissions'" platform-admin/app.js
          grep -q 'function viewAllowed' platform-admin/app.js
          grep -q "currentPermissions.has('staff.invites.manage')" platform-admin/app.js
          grep -q "currentPermissions.has('loyalty.programs.manage')" platform-admin/app.js
          grep -q "currentPermissions.has('merchants.status.manage')" platform-admin/app.js
          grep -q "rpc('admin_set_platform_operator'" platform-admin/app.js
          test -s supabase/migrations/20261123120000_platform_operator_rbac_foundation.sql
          test -s supabase/migrations/20261123133100_permission_scoped_admin_operations_retry.sql
          test -s supabase/migrations/20261123140000_admin_permission_context.sql
          test -s supabase/migrations/20261123143000_admin_status_invoker_wrapper.sql
          test -s supabase/migrations/20261123150000_platform_analytics_report_rpc.sql
          test -s supabase/migrations/20261123153000_permission_aware_merchant_status_guard.sql
          test -s supabase/migrations/20261123160000_enforce_loyalty_program_date_windows.sql
          test -s supabase/migrations/20261124010000_secure_bulk_qr_batches.sql
          test -s supabase/migrations/20261124013000_qr_batch_stable_serials.sql
          test -s supabase/migrations/20261124020000_hide_qr_claim_definer.sql
          test -s supabase/migrations/20261124023000_grant_qr_admin_wrappers.sql
          test -s supabase/migrations/20261124030000_qr_eligible_programs.sql
          test -s supabase/migrations/20261124040000_qr_claim_lock_order.sql
          test -s supabase/migrations/20261124050000_platform_super_admin_create_merchant.sql
          test -s supabase/migrations/20261124060000_merchant_subscription_management.sql
          test -s supabase/migrations/20261124061000_fix_subscription_directory_email_type.sql
          test -s supabase/migrations/20261124062000_subscription_history_rpc.sql
          test -s supabase/migrations/20261124063000_subscription_fk_indexes.sql
          test -s supabase/functions/platform-create-merchant-account/deno.json
          test -s supabase/functions/platform-create-merchant-account/index.ts
          grep -q "auth.admin.inviteUserByEmail" supabase/functions/platform-create-merchant-account/index.ts
          grep -q "platform_admins" supabase/functions/platform-create-merchant-account/index.ts
      - name: Package platform admin site
        run: |
          mkdir -p dist
          cp -R platform-admin dist/admin
          cp -R packages/design-tokens dist/packages
          mkdir -p dist/app
          cp app/config.js dist/app/config.js
          cd dist && zip -qr ../wathaq-platform-admin.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: wathaq-platform-admin
          path: wathaq-platform-admin.zip
          if-no-files-found: error
