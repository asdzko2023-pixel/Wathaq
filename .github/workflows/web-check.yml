name: WATHAQ Web Checks
on:
  push:
    branches: [build/wathaq-premium-foundation]
    paths:
      - 'web/**'
      - 'app/**'
      - 'supabase/bootstrap/**'
      - '.github/workflows/web-check.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'app/**'
      - 'supabase/bootstrap/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Build deployable WATHAQ Core bundle
        run: node app/build.mjs
      - name: Check generated bundle
        run: node --check public/app.js && test -s public/index.html && test -s public/config.js && grep -q 'ncfromrlnlotrwkgjenk.supabase.co' public/config.js
