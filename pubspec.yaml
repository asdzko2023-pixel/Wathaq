name: wathaq
description: WATHAQ native loyalty app
publish_to: "none"
version: 2.5.0+250

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.15.0
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo-horizontal-transparent.png
    - assets/brand/logo-mark-transparent.png
    - assets/brand/logo-horizontal-small.png
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  image_path: assets/brand/logo-mark-transparent.png
  adaptive_icon_background: "#211342"
  adaptive_icon_foreground: assets/brand/logo-mark-transparent.png
