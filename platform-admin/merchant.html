<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A1424">
  <meta name="description" content="بوابة التاجر في منصة وثاق">
  <title>بوابة التاجر | وِثاق</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./merchant.css?v=merchant-palette-4">
<style id="merchant-theme-fallback">
    :root, html, html[data-theme="light"], html[data-theme="dark"] {
      color-scheme: dark !important;
      --admin-bg:#081322 !important; --admin-panel:#102139 !important;
      --admin-panel-2:#172d48 !important; --admin-line:#49617f !important;
      --admin-text:#f6f1e6 !important; --admin-muted:#cbd7e6 !important;
      --admin-gold:#d9a93e !important; --admin-gold-soft:#f5dc98 !important;
      --color-bg:#081322 !important; --color-surface:#102139 !important;
      --color-surface-muted:#172d48 !important; --color-text:#f6f1e6 !important;
      --color-text-muted:#cbd7e6 !important;
      background:#081322 !important;
    }
    html, body, body:has(#merchant-app) {
      min-height:100% !important; margin:0 !important;
      background:#081322 !important; background-color:#081322 !important;
      background-image:radial-gradient(ellipse at 78% 0%,#1d3452 0%,#081322 58%) !important;
      background-attachment:fixed !important; color:#f6f1e6 !important;
    }
    #merchant-app, #merchant-app.merchant-app {
      min-height:100vh !important; background:#081322 !important;
      background-color:#081322 !important;
      background-image:radial-gradient(ellipse at 78% 0%,#1d3452 0%,#081322 58%) !important;
      color:#f6f1e6 !important;
    }
    #merchant-app .merchant-login-card, #merchant-app .merchant-store-card,
    #merchant-app .merchant-advanced-panel, #merchant-app .merchant-note,
    #merchant-app .merchant-topbar {
      background:#102139 !important; background-image:none !important;
      border:1px solid #49617f !important; color:#f6f1e6 !important;
      box-shadow:0 16px 36px rgba(0,0,0,.32) !important;
    }
    #merchant-app .merchant-brand strong, #merchant-app h1, #merchant-app h2,
    #merchant-app .merchant-page-title, #merchant-app .merchant-plan-price,
    #merchant-app .merchant-stat strong { color:#f5dc98 !important; }
    #merchant-app, #merchant-app p, #merchant-app label, #merchant-app small,
    #merchant-app .small, #merchant-app .muted, #merchant-app .merchant-subtitle,
    #merchant-app .merchant-section-label, #merchant-app .merchant-brand small {
      color:#cbd7e6 !important;
    }
    #merchant-app .primary-btn {
      background:linear-gradient(135deg,#f6e3ad,#d9a93e) !important;
      color:#101b2b !important; border:1px solid #f0d58a !important;
    }
    #merchant-app .ghost-btn {
      background:#203956 !important; color:#fff8e8 !important;
      border:1px solid #5a7696 !important;
    }
    #merchant-app input, #merchant-app select, #merchant-app textarea,
    #merchant-app .search-input {
      background:#091729 !important; color:#fff8e8 !important;
      border:1px solid #506987 !important;
    }
    #merchant-app .merchant-stat, #merchant-app .merchant-limits span,
    #merchant-app .merchant-features.planned span {
      background:#0a192b !important; color:#f0f4fa !important;
      border-color:#405a78 !important;
    }
    #merchant-app .merchant-features:not(.planned) span {
      background:#123b35 !important; color:#c5f4e9 !important;
      border-color:#397b70 !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script defer src="./merchant.js"></script>
</head>
<body>
  <div id="merchant-app" class="merchant-app">
    <main class="center-state"><span class="brand-mark">و</span><p>جارٍ فتح بوابة التاجر…</p></main>
  </div>
  <noscript>يتطلب تشغيل بوابة التاجر تفعيل JavaScript.</noscript>
</body>
</html>
