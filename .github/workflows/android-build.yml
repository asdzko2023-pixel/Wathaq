name: WATHAQ Android Debug APK

on:
  push:
    branches: [build/wathaq-premium-foundation]
    paths:
      - 'web/**'
      - 'app/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'public/**'
      - 'docs/ANDROID_BUILD.md'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'app/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'public/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wathaq-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout WATHAQ
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run web:build

      - name: Generate native Android project
        run: npx cap add android

      - name: Register WATHAQ native OAuth deep link
        run: node scripts/configure-android.mjs

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WATHAQ-Android-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
