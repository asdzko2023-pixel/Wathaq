name: Flutter Android Debug
on:
  workflow_dispatch:
  push:
    branches: [native/flutter-customer-foundation]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-android.yml'
      - 'scripts/download_fonts.sh'
permissions:
  contents: read
actions: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true
      - name: Install bundled Arabic font
        run: sh scripts/download_fonts.sh
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: WATHAQ-Flutter-Android-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
