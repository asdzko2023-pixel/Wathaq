name: WATHAQ Platform Admin Checks
on:
  push:
    branches: [admin/platform-console-v1]
    paths:
      - 'platform-admin/**'
      - 'packages/design-tokens/**'
      - 'app/config.js'
      - 'supabase/migrations/**'
      - '.github/workflows/platform-admin-check.yml'
  pull_request:
    paths:
      - 'platform-admin/**'
      - 'packages/design-tokens/**'
      - 'app/config.js'
      - 'supabase/migrations/**'
      - '.github/workflows/platform-admin-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check platform admin JavaScript syntax
        run: node --check platform-admin/app.js
      - name: Validate standalone console assets
        run: |
          test -s platform-admin/index.html
          test -s platform-admin/styles.css
          test -s platform-admin/app.js
          grep -q '../app/config.js' platform-admin/index.html
          grep -q 'platform_admins' platform-admin/app.js
          grep -q "rpc('admin_set_merchant_status'" platform-admin/app.js
          grep -q "rpc('admin_list_user_profiles'" platform-admin/app.js
          grep -q "rpc('admin_list_merchant_staff'" platform-admin/app.js
          grep -q "rpc('admin_set_merchant_member_active'" platform-admin/app.js
          grep -q "rpc('admin_create_merchant_invite'" platform-admin/app.js
          grep -q "rpc('admin_list_merchant_invites'" platform-admin/app.js
          grep -q "rpc('admin_revoke_merchant_invite'" platform-admin/app.js
          test -s supabase/migrations/20261123090000_admin_merchant_staff_invitation_controls.sql
          grep -q 'private.is_platform_admin()' supabase/migrations/20261123090000_admin_merchant_staff_invitation_controls.sql
          grep -q 'extensions.digest(v_code' supabase/migrations/20261123090000_admin_merchant_staff_invitation_controls.sql
          grep -q 'platform.merchant_staff_invited' supabase/migrations/20261123090000_admin_merchant_staff_invitation_controls.sql
          grep -q 'platform.merchant_invite_revoked' supabase/migrations/20261123090000_admin_merchant_staff_invitation_controls.sql
          grep -q 'security invoker' supabase/migrations/20261123090000_admin_merchant_staff_invitation_controls.sql
          test -s supabase/migrations/20261123093000_guard_merchant_invite_acceptance.sql
          grep -q 'on conflict'  supabase/migrations/20261123093000_guard_merchant_invite_acceptance.sql
          grep -q "'already_member'" supabase/migrations/20261123093000_guard_merchant_invite_acceptance.sql
          grep -q 'security definer' supabase/migrations/20261123093000_guard_merchant_invite_acceptance.sql
          ! grep -q "from('profiles')" platform-admin/app.js
          grep -q 'audit_events' platform-admin/app.js
          ! grep -q "from('merchants').update" platform-admin/app.js
          test -s supabase/migrations/20261122160000_admin_set_merchant_status_rpc.sql
          test -s supabase/migrations/20261122210113_admin_user_directory_rpc.sql
          grep -q 'private.is_platform_admin()' supabase/migrations/20261122210113_admin_user_directory_rpc.sql
          grep -q 'revoke all on function public.admin_list_user_profiles' supabase/migrations/20261122210113_admin_user_directory_rpc.sql
          grep -q 'grant execute on function public.admin_list_user_profiles.*authenticated' supabase/migrations/20261122210113_admin_user_directory_rpc.sql
          test -s supabase/migrations/20261122210157_admin_user_directory_invoker_wrapper.sql
          test -s supabase/migrations/20261122220947_admin_merchant_staff_directory.sql
          grep -q 'private.is_platform_admin()' supabase/migrations/20261122220947_admin_merchant_staff_directory.sql
          grep -q 'security invoker' supabase/migrations/20261122220947_admin_merchant_staff_directory.sql
          test -s supabase/migrations/20261122224500_admin_manage_merchant_member_status.sql
          grep -q 'private.is_platform_admin()' supabase/migrations/20261122224500_admin_manage_merchant_member_status.sql
          grep -q "v_member.role = 'owner'" supabase/migrations/20261122224500_admin_manage_merchant_member_status.sql
          grep -q 'insert into public.audit_events' supabase/migrations/20261122224500_admin_manage_merchant_member_status.sql
          grep -q 'security invoker' supabase/migrations/20261122224500_admin_manage_merchant_member_status.sql
          grep -q 'security invoker' supabase/migrations/20261122210157_admin_user_directory_invoker_wrapper.sql
          grep -q 'private.admin_list_user_profiles' supabase/migrations/20261122210157_admin_user_directory_invoker_wrapper.sql
          grep -q 'private.is_platform_admin()' supabase/migrations/20261122160000_admin_set_merchant_status_rpc.sql
          grep -q 'grant execute.*authenticated' supabase/migrations/20261122160000_admin_set_merchant_status_rpc.sql
          ! grep -qi 'grant update on public.merchants' supabase/migrations/20261122160000_admin_set_merchant_status_rpc.sql
          ! grep -R -E 'service_role|SUPABASE_SERVICE_ROLE_KEY' platform-admin/
      - name: Package platform admin site
        run: |
          mkdir -p dist
          cp -R platform-admin dist/admin
          cp -R packages/design-tokens dist/packages
          mkdir -p dist/app
          cp app/config.js dist/app/config.js
          cd dist && zip -qr ../wathaq-platform-admin.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: wathaq-platform-admin
          path: wathaq-platform-admin.zip
          if-no-files-found: error
