name: Flutter Android Debug
on:
  workflow_dispatch:
  push:
    branches: [native/flutter-customer-foundation]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-android.yml'
      - 'scripts/download_fonts.sh'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform without overwriting app sources
        run: |
          flutter create --platforms=android --project-name wathaq /tmp/wathaq_scaffold
          cp -R /tmp/wathaq_scaffold/android ./android
          sed -i 's/applicationId = ".*"/applicationId = "com.wathaq.app"/' android/app/build.gradle.kts
          sed -i 's/namespace = ".*"/namespace = "com.wathaq.app"/' android/app/build.gradle.kts
      - name: Install bundled Arabic font
        run: sh scripts/download_fonts.sh
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: WATHAQ-Flutter-Android-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
