<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#351044"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><meta name="description" content="وِثاق — نظام ولاء يجمع العلامات التجارية وعملاءها في تجربة واحدة.">
<title>وثاق | WATHAQ — ولاؤك له قيمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>
<body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
<header class="topbar">
 <a class="brand" href="#"><img src="./wathaq-logo.svg" alt="وثاق WATHAQ" style="width:150px;height:54px;object-fit:contain"></a>
 <nav class="role-switch" aria-label="نوع الواجهة"><button class="active" data-view="customer">المستخدم</button><button data-view="merchant">التاجر</button></nav>
 <div class="top-actions"><span id="connection" class="connection"><i></i> متصل</span><button id="authButton" class="btn btn-outline">تسجيل الدخول</button><button id="profileButton" class="avatar" hidden>و</button></div>
</header>
<main id="app" class="shell"><div class="loading"><span class="spinner"></span><p>ننسج تجربتك...</p></div></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="authDialog" class="dialog"><div class="google-auth-panel"><button class="dialog-close" type="button" data-close>×</button><img class="auth-brand-logo" src="./wathaq-logo.svg" alt="وثاق WATHAQ"><div class="eyebrow">مرحباً بك في وِثاق</div><h2>ابدأ رحلتك مع وثاق</h2><p class="muted">أنشئ حسابك أو سجّل الدخول مباشرة باستخدام حساب Google.</p><button class="google-signin-btn" id="googleSignIn" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.77 7.18l7.73 6C44.4 37.95 46.98 31.9 46.98 24.55z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.2A23.9 23.9 0 0 0 0 24c0 3.88.93 7.55 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.14 1.44-4.89 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>المتابعة باستخدام Google</span></button><p id="authError" class="error" role="alert"></p><small class="muted">بالمتابعة، أنت توافق على شروط الاستخدام وسياسة الخصوصية.</small></div></dialog>
<dialog id="scanDialog" class="dialog scan-dialog"><div class="scan-inner"><button class="dialog-close" type="button" data-scan-close>×</button><div class="eyebrow">ماسح وِثاق</div><h2>وجّه الكاميرا نحو رمز العميل</h2><video id="scanVideo" playsinline muted></video><p class="muted">يتم التحقق من الرمز على الخادم بعد قراءته.</p></div></dialog><script src="./config.js"></script><script type="module" src="./app.js"></script>
</body></html>
